<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>VR 시기능 훈련 시스템 V18.1 (Mosquitto 보안 우회판)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    body.admin-mode { display: flex; flex-direction: row; height: 100vh; width: 100vw; }
    #admin-sidebar { width: 360px; height: 100vh; background: #0b0f1a; color: white; padding: 20px; box-sizing: border-box; display: none; flex-direction: column; border-right: 2px solid #1e293b; z-index: 99999; overflow-y: auto; position: relative; }
    body.admin-mode a-scene { position: relative !important; flex: 1 !important; height: 100vh !important; width: auto !important; display: block !important; }
    .center-info { font-size: 11px; color: #94a3b8; text-align: center; margin-bottom: 2px; }
    .center-title { font-size: 16px; font-weight: bold; color: #38bdf8; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #3b82f6; }
    .panel-group { margin-bottom: 12px; background: rgba(30, 41, 59, 0.5); padding: 10px; border-radius: 8px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #cbd5e1; font-weight: bold; }
    select, input[type="range"] { width: 100%; padding: 6px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
    .display-value { float: right; color: #38bdf8; font-weight: bold; }
    .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px; }
    #start-btn { background: #22c55e; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
    #score-board { background: rgba(15, 23, 42, 0.95); color: #fff; padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; font-size: 13px; margin-bottom: 12px; }
    .board-status { color: #ef4444; font-family: monospace; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .exit-vr-btn { width: 100%; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 6px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 8px; display: block; }
    #vr-wait-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #070a12; color: #38bdf8; z-index: 999999; display: none; flex-direction: column; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; text-align: center; padding: 20px; box-sizing: border-box; }
    .spinner { border: 4px solid rgba(56, 189, 248, 0.2); border-left-color: #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .bypass-touch-btn { background: #38bdf8; color: #000; padding: 18px 40px; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 25px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    #result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100000; background: rgba(11, 16, 26, 0.98); color: white; padding: 35px 50px; border-radius: 15px; border: 3px solid #38bdf8; text-align: center; }
    #result-modal h1 { color: #38bdf8; margin-top: 0; }
    #result-modal .final-score { font-size: 42px; color: #eab308; margin: 20px 0; font-weight: bold; }
    #result-modal .reset-btn { background: #38bdf8; color: #000; padding: 10px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .full-scene-vr { position: absolute !important; top: 0; left: 0; width: 100vw !important; height: 100vh !important; }
  </style>
  <script>
    AFRAME.registerComponent('stereo-eye-lock', {
      schema: { eye: {type: 'string', default: 'both'} },
      init: function () {
        this.layerMask = (this.data.eye === 'left') ? 1 : (this.data.eye === 'right' ? 2 : 0);
        this.el.addEventListener('object3dset', () => { this.applyLayer(); });
        this.applyLayer();
      },
      applyLayer: function () {
        const obj = this.el.getObject3D('mesh') || this.el.object3D;
        if (obj) {
          obj.layers.set(this.layerMask);
          obj.traverse(child => { if(child.layers) child.layers.set(this.layerMask); });
        }
      }
    });
    AFRAME.registerComponent('vr-loop-manager', {
      tick: function (time, timeDelta) {
        if (typeof window.checkTargetGazeIntersectionInternal === 'function') {
          window.checkTargetGazeIntersectionInternal();
        }
        if (typeof window.animateBackgroundScrollInternal === 'function') {
          window.animateBackgroundScrollInternal();
        }
      }
    });
  </script>
</head>
<body>
  <div id="admin-sidebar">
    <div class="center-info">시기능 시지각 전문 훈련 기관</div>
    <div class="center-title">한국시기능훈련센터 성서계명대점</div>
    <div id="score-board">
      <div class="board-status">남은시간: <span id="val-time">10:00</span></div>
      <div style="color: #eab308; font-weight: bold; margin-bottom: 4px;">상태: <span id="active-eye-txt">-</span></div>
      <div style="color: #38bdf8; font-weight: bold; margin-bottom: 4px;">배경 자극: <span id="active-pattern-txt">우측 이동</span></div>
      <div style="font-weight: bold; margin-bottom: 6px;">점수: <span id="val-score" style="color:#22c55e;">0000</span></div>
      <div style="color: #a7f3d0; font-size: 11px;" id="status-txt">훈련 신호 대기 중...</div>
      <button id="exit-vr-control" class="exit-vr-btn" onclick="sendStopCommand()">🔴 원격 훈련 중단</button>
    </div>
    <div class="panel-group">
      <label>⏱️ 총 훈련 시간 설정</label>
      <select id="training-time-select" onchange="sendConfigToVR()">
        <option value="60">1분 (테스트)</option>
        <option value="300">5분 (기본)</option>
        <option value="600" selected>10분 (정밀)</option>
      </select>
    </div>
    <div class="panel-group">
      <label>👁️ 안구 선택 모드</label>
      <select id="eye-mode-select" onchange="sendConfigToVR()">
        <option value="alternating" selected>교대 출현 (OU)</option>
        <option value="leftOnly">왼쪽 눈 전용 (L)</option>
        <option value="rightOnly">오른쪽 눈 전용 (R)</option>
      </select>
    </div>
    <div class="panel-group">
      <label>🎮 훈련 구동 방식</label>
      <select id="run-mode-select" onchange="toggleRunModeUI(); sendConfigToVR();">
        <option value="manual" selected>수동 모드</option>
        <option value="auto">자동 모드</option>
      </select>
    </div>
    <div id="manual-direction-group" class="panel-group">
      <label>🗺️ 배경 이동 방향</label>
      <select id="manual-dir-select" onchange="sendConfigToVR()">
        <option value="right" selected>우측</option>
        <option value="left">좌측</option>
        <option value="up">상측</option>
        <option value="down">하측</option>
        <option value="clockwise">시계</option>
        <option value="counterclockwise">반시계</option>
      </select>
    </div>
    <div id="auto-time-group" class="panel-group" style="display: none;">
      <label>🔄 자동 전환 주기</label>
      <select id="auto-interval-select" onchange="sendConfigToVR()">
        <option value="120" selected>2분</option>
        <option value="180">3분</option>
      </select>
    </div>
    <div class="panel-group">
      <label>🏁 배경 격자 크기 <span class="display-value" id="grid-size-txt">4</span></label>
      <input type="range" id="grid-size-slider" min="1" max="12" value="4" step="1">
    </div>
    <div class="panel-group">
      <label>↔️ 풍선 출현 반경 <span class="display-value" id="range-txt">1.40</span></label>
      <input type="range" id="range-slider" min="0.50" max="2.40" value="1.40" step="0.10">
    </div>
    <div class="panel-group">
      <label>🔄 배경 속도 <span class="display-value" id="bg-speed-txt">2</span></label>
      <input type="range" id="bg-speed-slider" min="0" max="60" value="2" step="1">
    </div>
    <button id="start-btn" class="btn" onclick="sendStartCommand()">▶️ VR 원격 훈련 시작</button>
  </div>
  <div id="vr-wait-screen">
    <div id="wait-spinner" class="spinner" style="display:none;"></div>
    <div id="wait-msg">메타 브라우저 무선 통신 보안 우회를 위해<br>아래 버튼을 한 번 터치(클릭)해 주세요.</div>
    <button id="bypass-btn" class="bypass-touch-btn" onclick="activateAndConnect()">보안 우회 및 서버 연결</button>
  </div>
  <div id="result-modal">
    <h1>🎉 시기능 훈련 완료 🎉</h1>
    <div class="final-score"><span id="modal-final-score">0</span> 점</div>
    <button class="reset-btn" onclick="sendReloadCommand()">확인</button>
  </div>
  <a-scene id="vr-scene" background="color: #000000" vr-mode-ui="enabled: true" vr-loop-manager>
    <a-assets><canvas id="bgCheckerCanvas" width="512" height="512"></canvas></a-assets>
    <a-sky id="rotating-bg" src="#bgCheckerCanvas" radius="50" material="shader: flat; repeat: 16 16; side: back;" stereo-eye-lock="eye: both"></a-sky>
    <a-entity id="cameraRig">
      <a-entity id="mainCamera" camera look-controls position="0 1.6 0">
        <a-entity id="centerFixationRay" raycaster="objects: .gaze-secure-trigger; far: 100; interval: 10;"></a-entity>
        <a-ring id="gaze-ring-left" radius-inner="0.02" radius-outer="0.03" color="#000000" position="-0.03 0 -1" material="shader: flat; opacity: 0.9; depthTest: false;" stereo-eye-lock="eye: left"></a-ring>
        <a-ring id="gaze-ring-right" radius-inner="0.02" radius-outer="0.03" color="#000000" position="0.03 0 -1" material="shader: flat; opacity: 0.9; depthTest: false;" stereo-eye-lock="eye: right"></a-ring>
      </a-entity>
    </a-entity>
    <a-entity id="magic-eye-board" visible="false">
      <a-entity id="left-eye-container" stereo-eye-lock="eye: left">
        <a-sphere id="balloon-left" color="#ff2a2a"><a-cone id="cone-left" color="#cc1111"></a-cone></a-sphere>
      </a-entity>
      <a-entity id="right-eye-container" stereo-eye-lock="eye: right">
        <a-sphere id="balloon-right" color="#10b981"><a-cone id="cone-right" color="#047857"></a-cone></a-sphere>
      </a-entity>
      <a-entity id="gaze-collision-trigger" class="gaze-secure-trigger" material="visible: false;" stereo-eye-lock="eye: both"></a-entity>
    </a-entity>
    <a-entity id="particle-group"></a-entity>
  </a-scene>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'vr';
    const topic_cmd = "kr_vision/seongseo/cmd";
    const topic_state = "kr_vision/seongseo/state";
    let client = null;
    const sceneEl = document.getElementById('vr-scene');
    if (mode === 'admin') {
      document.body.classList.add('admin-mode');
      document.getElementById('admin-sidebar').style.display = 'flex';
      document.getElementById('left-eye-container').setAttribute('stereo-eye-lock', 'eye: both');
      document.getElementById('right-eye-container').setAttribute('stereo-eye-lock', 'eye: both');
      window.addEventListener('load', () => { initMQTT(); });
    } else {
      sceneEl.classList.add('full-scene-vr');
      document.getElementById('vr-wait-screen').style.display = 'flex';
    }
    function activateAndConnect() {
      document.getElementById('bypass-btn').style.display = 'none';
      document.getElementById('wait-spinner').style.display = 'block';
      document.getElementById('wait-msg').innerHTML = "핫스팟 방화벽 우회 터널 생성 중...";
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      initMQTT();
    }
    function initMQTT() {
      // [V18.1] 핫스팟 프리패스 Mosquitto 전용 암호화 포트 적용
      client = mqtt.connect('wss://test.mosquitto.org:8081/mqtt', {
        connectTimeout: 5000,
        clientId: 'seongseo_' + mode + '_' + Math.random().toString(16).substr(2, 8),
        keepalive: 10,
        reconnectPeriod: 1000,
        clean: true
      });
      client.on('connect', () => {
        if (mode === 'admin') { client.subscribe(topic_state); document.getElementById('status-txt').innerText = "VR 기기 신호 대기 중..."; }
        else { client.subscribe(topic_cmd); }
      });
      client.on('offline', () => { if(mode === 'vr') { document.getElementById('wait-msg').innerText = "신호 재구축 중..."; } });
      client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        if (topic === topic_cmd && mode === 'vr') handleAdminCommand(data);
        else if (topic === topic_state && mode === 'admin') handleVRState(data);
      });
    }
    // ... (기존 핸들러 및 훈련 로직 동일하게 유지)
    function handleAdminCommand(data) { if (mode !== 'vr') return; if (data.type === 'config') { rowsCols = data.gridSize; redrawBackgroundGrid(); randomRange = data.range; rotationSpeed = data.speed; window.virtualTimeSetting = data.time; window.virtualEyeMode = data.eyeMode; window.virtualRunMode = data.runMode; window.virtualManualDir = data.manualDir; window.virtualAutoInterval = data.autoInterval; } else if (data.type === 'start') { document.getElementById('vr-wait-screen').style.display = 'none'; startFusionTrainingLocal(); } else if (data.type === 'stop') { exitVRModeManuallyLocal(); document.getElementById('vr-wait-screen').style.display = 'flex'; document.getElementById('wait-msg').innerText = "중단됨. 대기 중..."; } else if (data.type === 'reload') { location.reload(); } }
    function handleVRState(data) { if (mode !== 'admin') return; if (data.type === 'sync') { document.getElementById('val-score').innerText = data.score.toString().padStart(4, '0'); document.getElementById('val-time').innerText = data.timeLeft; document.getElementById('active-eye-txt').innerText = data.activeEyeTxt; document.getElementById('active-eye-txt').style.color = data.activeEyeColor; document.getElementById('status-txt').innerText = data.statusTxt; let dirTxt = "우측 이동"; if(data.manualDir === "left") dirTxt = "좌측 이동"; else if(data.manualDir === "up") dirTxt = "상측 이동"; else if(data.manualDir === "down") dirTxt = "하측 이동"; else if(data.manualDir === "clockwise") dirTxt = "시계 회전"; else if(data.manualDir === "counterclockwise") dirTxt = "반시계 회전"; document.getElementById('active-pattern-txt').innerText = dirTxt; if(data.isTrainingActiveLocal) { isTrainingActive = true; rotX = data.rx; rotY = data.ry; rotZ = data.rz; const sky = document.getElementById('rotating-bg'); if (sky) sky.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`); const magicBoard = document.getElementById('magic-eye-board'); magicBoard.setAttribute('visible', 'true'); const bLeft = document.getElementById('balloon-left'); const bRight = document.getElementById('balloon-right'); if(data.activeTurnLocal === "left") { bLeft.setAttribute('visible', 'true'); bRight.setAttribute('visible', 'false'); bLeft.setAttribute('position', `${data.cx} ${data.cy} ${data.cz}`); } else { bLeft.setAttribute('visible', 'false'); bRight.setAttribute('visible', 'true'); bRight.setAttribute('position', `${data.cx} ${data.cy} ${data.cz}`); } } } else if (data.type === 'finish') { isTrainingActive = false; document.getElementById('magic-eye-board').setAttribute('visible', 'false'); document.getElementById('modal-final-score').innerText = data.score; document.getElementById('result-modal').style.display = 'block'; } }
    function sendConfigToVR() { if (mode !== 'admin') return; const payload = { type: 'config', time: document.getElementById('training-time-select').value, eyeMode: document.getElementById('eye-mode-select').value, runMode: document.getElementById('run-mode-select').value, manualDir: document.getElementById('manual-dir-select').value, autoInterval: document.getElementById('auto-interval-select').value, gridSize: parseInt(document.getElementById('grid-size-slider').value), range: parseFloat(document.getElementById('range-slider').value), speed: parseInt(document.getElementById('bg-speed-slider').value) }; if(client && client.connected) client.publish(topic_cmd, JSON.stringify(payload)); rowsCols = payload.gridSize; redrawBackgroundGrid(); }
    function sendStartCommand() { sendConfigToVR(); if(client && client.connected) client.publish(topic_cmd, JSON.stringify({type: 'start'})); isTrainingActive = true; document.getElementById('magic-eye-board').setAttribute('visible', 'true'); }
    function sendStopCommand() { if(client && client.connected) client.publish(topic_cmd, JSON.stringify({type: 'stop'})); isTrainingActive = false; document.getElementById('magic-eye-board').setAttribute('visible', 'false'); }
    function sendReloadCommand() { if(client && client.connected) client.publish(topic_cmd, JSON.stringify({type: 'reload'})); setTimeout(() => { location.reload(); }, 300); }
    if (mode === 'admin') { document.getElementById('grid-size-slider').addEventListener('input', (e) => { document.getElementById('grid-size-txt').innerText = e.target.value; sendConfigToVR(); }); document.getElementById('range-slider').addEventListener('input', (e) => { document.getElementById('range-txt').innerText = parseFloat(e.target.value).toFixed(2); sendConfigToVR(); }); document.getElementById('bg-speed-slider').addEventListener('input', (e) => { document.getElementById('bg-speed-txt').innerText = e.target.value; sendConfigToVR(); }); }
    let rowsCols = 4; function redrawBackgroundGrid() { const bgCanvas = document.getElementById('bgCheckerCanvas'); const bgCtx = bgCanvas.getContext('2d'); const bSize = 512; const bW = bSize / rowsCols; const bH = bSize / rowsCols; bgCtx.clearRect(0, 0, bSize, bSize); for (let r = 0; r < rowsCols; r++) { for (let c = 0; c < rowsCols; c++) { bgCtx.fillStyle = ((r + c) % 2 === 0) ? '#FFFFFF' : '#000000'; bgCtx.fillRect(c * bW, r * bH, bW, bH); } } const sky = document.getElementById('rotating-bg'); if(sky && sky.components.material && sky.components.material.material && sky.components.material.material.map) { sky.components.material.material.map.needsUpdate = true; } } redrawBackgroundGrid();
    let audioCtx = null; let score = 0; let randomRange = 1.40; let rotationSpeed = 2; let isTrainingActive = false; let isPopping = false; let elapsedInterval = null; let totalSecondsElapsed = 0; let targetSeconds = 600; let activeTurn = "left"; let currentX = 0, currentY = 1.6, currentZ = -16.0; let gazeTimer = null; let autoStep = 0; let internalAutoTime = 0; let rotX = 0, rotY = 0, rotZ = 0;
    window.virtualTimeSetting = "600"; window.virtualEyeMode = "alternating"; window.virtualRunMode = "manual"; window.virtualManualDir = "right"; window.virtualAutoInterval = "120";
    function toggleRunModeUI() { if (mode !== 'admin') return; const runMode = document.getElementById('run-mode-select').value; document.getElementById('manual-direction-group').style.display = (runMode === 'manual') ? 'block' : 'none'; document.getElementById('auto-time-group').style.display = (runMode === 'auto') ? 'block' : 'none'; }
    function transmitStateToAdmin() { if (mode !== 'vr' || !client || !client.connected) return; let timeMin = Math.floor((targetSeconds - totalSecondsElapsed) / 60).toString().padStart(2, '0'); let timeSec = ((targetSeconds - totalSecondsElapsed) % 60).toString().padStart(2, '0'); let timeLeftStr = `${timeMin}:${timeSec}`; let activeEyeTxt = (activeTurn === "left") ? "왼쪽 활성 (OU)" : "오른쪽 활성 (OU)"; let activeEyeColor = (activeTurn === "left") ? "#ff2a2a" : "#10b981"; const payload = { type: 'sync', score: score, timeLeft: timeLeftStr, activeEyeTxt: activeEyeTxt, activeEyeColor: activeEyeColor, statusTxt: gazeTimer ? "🎯 융합 유지 중..." : "훈련 중...", isTrainingActiveLocal: isTrainingActive, activeTurnLocal: activeTurn, manualDir: window.virtualManualDir, rx: rotX, ry: rotY, rz: rotZ, cx: currentX, cy: currentY, cz: currentZ }; client.publish(topic_state, JSON.stringify(payload)); }
    function renderRandomTargetsOnly() { if (!isTrainingActive || mode !== 'vr') return; const cameraEl = document.getElementById('mainCamera'); let camPos = {x: 0, y: 1.6, z: 0}; if (cameraEl && cameraEl.object3D) { camPos.x = cameraEl.object3D.position.x; camPos.y = cameraEl.object3D.position.y; camPos.z = cameraEl.object3D.position.z; } let zOffset = 16.0; let baseZ = camPos.z - zOffset; let spreadFactor = zOffset / 4.2; let randX = camPos.x + (Math.random() - 0.5) * (randomRange * 1.3 * spreadFactor); let randY = camPos.y + (Math.random() - 0.5) * (randomRange * 1.0 * spreadFactor); if (randY < camPos.y - (0.5 * spreadFactor)) randY = camPos.y - (0.5 * spreadFactor); if (randY > camPos.y + (0.7 * spreadFactor)) randY = camPos.y + (0.7 * spreadFactor); currentX = randX; currentY = randY; currentZ = baseZ; const cLeft = document.getElementById('left-eye-container'); const cRight = document.getElementById('right-eye-container'); const bLeft = document.getElementById('balloon-left'); const bRight = document.getElementById('balloon-right'); const secureTrigger = document.getElementById('gaze-collision-trigger'); const raycasterEl = document.getElementById('centerFixationRay'); if (activeTurn === "left") { cLeft.setAttribute('visible', 'true'); cRight.setAttribute('visible', 'false'); if (raycasterEl) raycasterEl.setAttribute('position', '-0.03 0 0'); bLeft.setAttribute('position', `${randX} ${randY} ${baseZ}`); bLeft.setAttribute('radius', '1.80'); } else { cLeft.setAttribute('visible', 'false'); cRight.setAttribute('visible', 'true'); if (raycasterEl) raycasterEl.setAttribute('position', '0.03 0 0'); bRight.setAttribute('position', `${randX} ${randY} ${baseZ}`); bRight.setAttribute('radius', '1.80'); } if (secureTrigger) { secureTrigger.setAttribute('position', `${randX} ${randY} ${baseZ}`); secureTrigger.setAttribute('geometry', `primitive: sphere; radius: 2.5`); if (!isPopping && !secureTrigger.classList.contains('gaze-secure-trigger')) secureTrigger.classList.add('gaze-secure-trigger'); } transmitStateToAdmin(); }
    window.checkTargetGazeIntersectionInternal = function() { if (!isTrainingActive || isPopping || mode !== 'vr') return; const raycasterEl = document.getElementById('centerFixationRay'); if (!raycasterEl) return; let raycasterComponent = raycasterEl.components.raycaster; if (raycasterComponent && raycasterComponent.intersections && raycasterComponent.intersections.length > 0) { if (!gazeTimer) { transmitStateToAdmin(); gazeTimer = setTimeout(() => { const secureTrigger = document.getElementById('gaze-collision-trigger'); if (secureTrigger) secureTrigger.classList.remove('gaze-secure-trigger'); isPopping = true; gazeTimer = null; popTargetSuccess(); }, 1000); } } else if (gazeTimer) { clearTimeout(gazeTimer); gazeTimer = null; transmitStateToAdmin(); } };
    function popTargetSuccess() { playPopSound(); score += 1000; triggerParticlesEmission(currentX, currentY, currentZ, 30); if (window.virtualEyeMode === "alternating") activeTurn = (activeTurn === "left") ? "right" : "left"; document.getElementById('magic-eye-board').setAttribute('visible', 'false'); setTimeout(() => { if (!isTrainingActive) return; isPopping = false; renderRandomTargetsOnly(); document.getElementById('magic-eye-board').setAttribute('visible', 'true'); }, 400); }
    window.animateBackgroundScrollInternal = function() { if (!isTrainingActive) return; if (mode === 'vr') { const runMode = window.virtualRunMode; let activeBgDirection = (runMode === "manual") ? window.virtualManualDir : ["right", "left", "up", "down", "clockwise", "counterclockwise"][autoStep]; switch(activeBgDirection) { case "right": rotY += (rotationSpeed * 0.1); break; case "left": rotY -= (rotationSpeed * 0.1); break; case "up": rotX -= (rotationSpeed * 0.1); break; case "down": rotX += (rotationSpeed * 0.1); break; case "clockwise": rotZ += (rotationSpeed * 0.1); break; case "counterclockwise": rotZ -= (rotationSpeed * 0.1); break; } const sky = document.getElementById('rotating-bg'); if (sky) sky.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`); } };
    function startElapsedClock() { if (elapsedInterval) clearInterval(elapsedInterval); totalSecondsElapsed = 0; internalAutoTime = 0; autoStep = 0; elapsedInterval = setInterval(() => { if (!isTrainingActive) return; totalSecondsElapsed++; internalAutoTime++; if (window.virtualRunMode === "auto" && internalAutoTime >= parseInt(window.virtualAutoInterval)) { internalAutoTime = 0; autoStep = (autoStep + 1) % 6; } transmitStateToAdmin(); if (totalSecondsElapsed >= targetSeconds) { if(gazeTimer) { clearTimeout(gazeTimer); gazeTimer = null; } clearInterval(elapsedInterval); playFanfareAndFinish(); } }, 1000); }
    function playFanfareAndFinish() { isTrainingActive = false; document.getElementById('magic-eye-board').setAttribute('visible', 'false'); if(client && client.connected) client.publish(topic_state, JSON.stringify({type: 'finish', score: score})); const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; notes.forEach((freq, index) => { setTimeout(() => { const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }, index * 120); }); setTimeout(() => { if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR(); document.getElementById('modal-final-score').innerText = score; document.getElementById('result-modal').style.display = 'block'; }, 1200); }
    function playPopSound() { if (!audioCtx) return; try { const osc1 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc1.type = 'sine'; osc1.frequency.setValueAtTime(440, audioCtx.currentTime); osc1.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12); osc1.connect(gainNode); gainNode.connect(audioCtx.destination); osc1.start(); osc1.stop(audioCtx.currentTime + 0.12); } catch(e) {} }
    function triggerParticlesEmission(x, y, z, count) { const pGroup = document.getElementById('particle-group'); for (let i = 0; i < count; i++) { const p = document.createElement('a-box'); p.setAttribute('width', '0.12'); p.setAttribute('height', '0.12'); p.setAttribute('depth', '0.12'); p.setAttribute('color', ['#ff0055', '#ffff00', '#00ffcc', '#38bdf8'][Math.floor(Math.random() * 4)]); p.setAttribute('position', `${x} ${y} ${z}`); const vx = (Math.random() - 0.5) * 6, vy = (Math.random() - 0.5) * 6 + 2.5, vz = (Math.random() - 0.5) * 6; pGroup.appendChild(p); let age = 0; const t = setInterval(() => { age += 16; p.setAttribute('position', `${x + vx * (age/1000)} ${y + vy * (age/1000) - (0.5 * 9.8 * (age/1000)**2)} ${z + vz * (age/1000)}`); if (age > 800) { clearInterval(t); if (p.parentNode) p.parentNode.removeChild(p); } }, 16); } }
    function startFusionTrainingLocal() { if (mode !== 'vr') return; isTrainingActive = true; isPopping = false; targetSeconds = parseInt(window.virtualTimeSetting); if(window.virtualEyeMode === "rightOnly") activeTurn = "right"; else activeTurn = "left"; document.getElementById('magic-eye-board').setAttribute('visible', 'true'); renderRandomTargetsOnly(); startElapsedClock(); if (sceneEl.hasLoaded) sceneEl.enterVR(); else sceneEl.addEventListener('loaded', () => sceneEl.enterVR()); }
    function exitVRModeManuallyLocal() { isTrainingActive = false; isPopping = false; if (gazeTimer) { clearTimeout(gazeTimer); gazeTimer = null; } if (elapsedInterval) clearInterval(elapsedInterval); document.getElementById('magic-eye-board').setAttribute('visible', 'false'); if (sceneEl && sceneEl.is('vr-mode')) sceneEl.exitVR(); }
    sceneEl.addEventListener('enter-vr', () => { const camera = sceneEl.camera; if (camera && camera.isArrayCamera) { camera.cameras[0].layers.enable(1); camera.cameras[0].layers.disable(2); camera.cameras[1].layers.enable(2); camera.cameras[1].layers.disable(1); } });
  </script>
